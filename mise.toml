# mise configuration for hibrow — https://mise.jdx.dev
# Pins the toolchain and provides build/test tasks.

[tools]
zig = "0.17.0"

# NOTE: the macOS SDK workaround (DEVELOPER_DIR=/dev/null) is applied per-build-
# task below, NOT in a project-wide [env]. Newer Command Line Tools SDKs
# (26.x/27.x) ship `.tbd` files the Zig linker cannot parse, so `zig build`
# fails to link libSystem with `undefined symbol: __availability_version_check`.
# Pointing DEVELOPER_DIR at a non-directory makes Zig fall back to its bundled
# libSystem stub. But that same variable breaks any tool that calls `xcrun`
# (git, clang, etc.), so it must stay scoped to the Zig build commands only and
# never leak into the shell for the whole project directory.

[tasks.build]
description = "Build hibrow (debug)"
env = { DEVELOPER_DIR = "/dev/null" }
run = "zig build"

[tasks.release]
description = "Build optimized (ReleaseFast)"
env = { DEVELOPER_DIR = "/dev/null" }
run = "zig build -Doptimize=ReleaseFast"

[tasks.test]
description = "Run the unit test suite"
env = { DEVELOPER_DIR = "/dev/null" }
run = "zig build test"

[tasks.e2e]
description = "Run the dual-browser (Chrome + Firefox) e2e feature tests"
run = "./tests/e2e-features.sh"

[tasks.run]
description = "Run the hibrow CLI (args after --, e.g. mise run run -- --help)"
env = { DEVELOPER_DIR = "/dev/null" }
run = "zig build run --"
