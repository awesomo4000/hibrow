<!doctype html><meta charset="utf-8"><title>shadow lab</title>
<div id="light">LIGHT-TEXT</div>
<div id="host"></div>
<script>
var sr=document.getElementById('host').attachShadow({mode:'open'});
sr.innerHTML='<p>SHADOW-TEXT</p><div id="nh"></div>';
var nsr=sr.getElementById('nh').attachShadow({mode:'open'});
nsr.innerHTML='<span>NESTED-SHADOW-TEXT</span>';
</script>
